name: AI Tool Autopilot Function Check

on:
  pull_request:
    paths:
      - "supabase/functions/ai-tool-autopilot-discover/**"
      - ".github/workflows/ai-tool-autopilot-check.yml"
  push:
    branches:
      - main
      - feature/ai-autopilot-foundation
    paths:
      - "supabase/functions/ai-tool-autopilot-discover/**"
      - ".github/workflows/ai-tool-autopilot-check.yml"

permissions:
  contents: read

jobs:
  deno-check:
    name: Type-check discovery Edge Function
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check function
        run: deno check supabase/functions/ai-tool-autopilot-discover/index.ts
